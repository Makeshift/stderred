name: Build and release

# Every push and pull request builds and tests all platforms. Pushing a v* tag also publishes
# the archives as a GitHub release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.libc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds use the oldest base that has the platform, so the library needs the
          # lowest glibc it can: Ubuntu 20.04 (glibc 2.31), or Debian 12 for i686.
          - { platform: linux/amd64, arch: x86_64, libc: gnu, base: 'ubuntu:20.04' }
          - { platform: linux/arm64, arch: aarch64, libc: gnu, base: 'ubuntu:20.04' }
          - { platform: linux/arm/v7, arch: armv7, libc: gnu, base: 'ubuntu:20.04' }
          - { platform: linux/386, arch: i686, libc: gnu, base: 'debian:bookworm' }
          - { platform: linux/ppc64le, arch: ppc64le, libc: gnu, base: 'ubuntu:20.04' }
          - { platform: linux/s390x, arch: s390x, libc: gnu, base: 'ubuntu:20.04' }
          - { platform: linux/riscv64, arch: riscv64, libc: gnu, base: 'ubuntu:20.04' }
          - { platform: linux/amd64, arch: x86_64, libc: musl, base: 'alpine:edge' }
          - { platform: linux/arm64, arch: aarch64, libc: musl, base: 'alpine:edge' }
          - { platform: linux/arm/v6, arch: armv6, libc: musl, base: 'alpine:edge' }
          - { platform: linux/arm/v7, arch: armv7, libc: musl, base: 'alpine:edge' }
          - { platform: linux/386, arch: i686, libc: musl, base: 'alpine:edge' }
          - { platform: linux/ppc64le, arch: ppc64le, libc: musl, base: 'alpine:edge' }
          - { platform: linux/s390x, arch: s390x, libc: musl, base: 'alpine:edge' }
          - { platform: linux/riscv64, arch: riscv64, libc: musl, base: 'alpine:edge' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and test
        run: >-
          docker buildx build
          --platform '${{ matrix.platform }}'
          --build-arg 'BASE=${{ matrix.base }}'
          --build-arg 'LIBC=${{ matrix.libc }}'
          --file .github/release/Dockerfile
          --output type=local,dest=out
          .
      - name: Package
        # Asset names follow the os-arch-libc tokens mise's github backend matches on.
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF == refs/tags/v* ]] || version=dev
          name="stderred-${version}-linux-${{ matrix.arch }}-${{ matrix.libc }}"
          cp LICENSE README.md out/
          tar -C out -czf "$name.tar.gz" lib LICENSE README.md
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error

  macos:
    name: darwin-universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install CMake
        run: brew install cmake
      - name: Build and test
        run: |
          cmake -S src -B build -DCMAKE_OSX_ARCHITECTURES='x86_64;arm64;arm64e'
          cmake --build build
          cd build && ctest --output-on-failure
      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF == refs/tags/v* ]] || version=dev
          name="stderred-${version}-darwin-universal"
          mkdir -p out/lib
          cp build/libstderred.dylib out/lib/
          cp LICENSE README.md out/
          tar -C out -czf "$name.tar.gz" lib LICENSE README.md
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes -- *.tar.gz SHA256SUMS
